# google cloud build
# gcloud beta builds submit --config cloudbuild-production.yml --region=us-south1 --substitutions=COMMIT_SHA=$(git rev-parse --short HEAD),_TIMESTAMP=$(date +%Y%m%d%H%M%S) --project=fluid-417204 .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "--cache-from=us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-base/web:latest",
        "--cache-from=us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:latest",
        "-t",
        "us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:$COMMIT_SHA",
        "-t",
        "us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:latest",
        ".",
        "-f",
        "docker/Dockerfile",
      ]
    id: build

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:$COMMIT_SHA",
      ]
    id: push-commit-sha

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:latest",
      ]
    id: push-latest

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "run",
        "jobs",
        "update",
        "${_APP_NAME}-migrations",
        "--image=us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:$COMMIT_SHA",
        "--project=fluid-prod-0",
        "--region=us-south1",
        "--network=fluid-prod-network-vpc",
        "--subnet=fluid-prod-network-cloudrun-us-south1",
        "--vpc-egress=all-traffic",
        "--service-account=fluid-prod-droplets@fluid-prod-0.iam.gserviceaccount.com",
        "--clear-cloudsql-instances",
        "--execute-now",
        "--wait",
      ]
    id: migrate
    entrypoint: gcloud

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "run",
        "services",
        "update",
        "${_APP_NAME}",
        "--platform=managed",
        "--image=us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:$COMMIT_SHA",
        "--project=fluid-prod-0",
        "--region=us-south1",
        "--network=fluid-prod-network-vpc",
        "--subnet=fluid-prod-network-cloudrun-us-south1",
        "--vpc-egress=all-traffic",
        "--service-account=fluid-prod-droplets@fluid-prod-0.iam.gserviceaccount.com",
        "--clear-cloudsql-instances",
        "--revision-suffix=${COMMIT_SHA}-${_TIMESTAMP}",
      ]
    id: deploy-production
    entrypoint: gcloud

substitutions:
  _APP_NAME: "fluid-droplet-dynamic-pricing"
  _APP_REPOSITORY: "fluid-droplets"

images:
  - "us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:$COMMIT_SHA"
  - "us-south1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-rails/web:latest"

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
