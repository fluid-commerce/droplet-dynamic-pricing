---
# Brakeman configuration. Picked up automatically by `bin/brakeman`, so a local
# run and CI reach the same verdict.
#
# EOLRails and EOLRuby report how much support life the Rails and Ruby releases
# in Gemfile.lock have left. They are dependency-lifecycle notices, not findings
# about this code: they appear on a calendar date (Rails 8.0 entered the window
# on 2026-08-07), no patch release clears them, and the only thing that does is a
# minor-version upgrade — its own change, with its own test run. Left enabled
# they turn a red security scan into a deadline nobody can act on inside a PR,
# which teaches the team to ignore the check.
#
# Everything else stays on, so a real finding still blocks a merge.
:skip_checks:
  - CheckEOLRails
  - CheckEOLRuby
