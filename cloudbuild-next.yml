# Builds and deploys the Next app as its OWN Cloud Run service.
#
#   gcloud beta builds submit --config cloudbuild-next.yml --region=europe-west1 \
#     --substitutions=COMMIT_SHA=$(git rev-parse --short HEAD),_TIMESTAMP=$(date +%Y%m%d%H%M%S) \
#     --project=fluid-417204 .
#
# Deliberately a SEPARATE service (`${_APP_NAME}-next`) rather than another
# revision of the Rails one. Nothing routes to it by hostname: Fluid calls
# whatever url is recorded in each installation's callback and webhook
# registrations, so this service receives no traffic at all until an
# installation is repointed at it. That makes deploying it inert, and makes
# cutover a per-company decision rather than a percentage.
#
# Region, project, artifact repository and substitution style are taken from
# cloudbuild-production.yml, which deploys the Rails service. Only the image
# path and the service name differ: `${_APP_NAME}-rails/web` becomes
# `${_APP_NAME}-next/web`, and `${_APP_NAME}` becomes `${_APP_NAME}-next`.
#
# There is no migrations step, and there must not be. Rails owns this schema;
# the Next app maps onto the same tables and treats them as read-shaped. Two
# migration tools against one database is how you get a schema neither app
# agrees with. cloudbuild-production.yml keeps the `${_APP_NAME}-migrations`
# job — including the one that creates `fluid_callback_registrations` — and that
# stays the Rails pipeline's business, not this one's.
#
# The Rails config also builds from `docker/Dockerfile`; this one builds from
# `Dockerfile.next` at the repo root, so the two images cannot collide.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "europe-west1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA",
        ".",
        "-f",
        "Dockerfile.next",
      ]
    id: build

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "tag",
        "europe-west1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA",
        "europe-west1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-next/web:latest",
      ]
    id: tag

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "europe-west1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA",
      ]
    id: push commit sha

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "europe-west1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-next/web:latest",
      ]
    id: push latest

  # `services update` rather than `deploy`: the service is created once, by
  # hand, and a service that does not exist yet fails loudly here instead of
  # coming up misconfigured.
  #
  # The SECRET mappings are declared here, not left on the service, so every
  # deploy carries them and a recreated service cannot silently lose one.
  # `--update-secrets` merges: it adds or repoints these three and leaves
  # everything else on the service alone. Each secret must exist before the
  # deploy runs, or Cloud Run rejects the revision.
  #
  #   DATABASE_URL                  the SAME database as the Rails service
  #   FLUID_WEBHOOK_AUTH_TOKEN      the same token as the Rails service
  #   FLUID_DROPLET_WEBHOOK_SECRET  the Next droplet record's `webhook_secret`,
  #                                 what Fluid signs droplet.installed /
  #                                 droplet.uninstalled with
  #
  # The STARTUP probe hits /api/ready, which answers 200 only once the database
  # does. Cloud Run's default is a TCP check that passes ~1.5s after the
  # container starts — before the Cloud SQL socket exists — so a new instance
  # was taking pricing callbacks it could not serve, and the first one timed
  # out on Fluid's side. Up to 40 x 3s for the database to appear; a probe that
  # never passes keeps the new revision from taking traffic and leaves the old
  # one serving. See src/app/api/ready/route.ts.
  #
  # Plain values stay on the service, set by hand: FLUID_DROPLET_URL (this
  # service's own url), DROPLET_UUID (the Next droplet's uuid), and optionally
  # LEGACY_RAILS_ORIGIN and ADMIN_API_TOKEN. See .env.example.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "run",
        "services",
        "update",
        "${_APP_NAME}-next",
        "--platform=managed",
        "--image=europe-west1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA",
        "--region=europe-west1",
        "--revision-suffix=${COMMIT_SHA}-${_TIMESTAMP}",
        "--update-secrets=DATABASE_URL=DYNAMIC_PRICING_DATABASE_URL:latest,FLUID_WEBHOOK_AUTH_TOKEN=DYNAMIC_PRICING_FLUID_WEBHOOK_AUTH_TOKEN:latest,FLUID_DROPLET_WEBHOOK_SECRET=DYNAMIC_PRICING_NEXT_DROPLET_WEBHOOK_SECRET:latest",
        "--startup-probe=httpGet.path=/api/ready,initialDelaySeconds=0,periodSeconds=3,timeoutSeconds=3,failureThreshold=40",
      ]
    id: deploy next
    entrypoint: gcloud

substitutions:
  _APP_NAME: "fluid-droplet-dynamic-pricing"
  _APP_REPOSITORY: "fluid-droplets"

images:
  - "europe-west1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA"
  - "europe-west1-docker.pkg.dev/fluid-417204/${_APP_REPOSITORY}/${_APP_NAME}-next/web:latest"

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
